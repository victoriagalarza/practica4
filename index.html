<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laboratorio Botánico 3D - Simulación de Crecimiento</title>

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <!-- =====================================================
         CONTENEDOR PRINCIPAL DE LA ESCENA 3D
    ====================================================== -->

    <div id="canvas-container"></div>


    <!-- =====================================================
         PANEL DE INFORMACIÓN BOTÁNICA
         Se actualiza mediante Raycasting
    ====================================================== -->

    <aside id="info-panel" class="hud-card">

        <div class="card-header">
            <h3>🌿 Ficha de Crecimiento</h3>
            <span class="badge">Raycasting</span>
        </div>

        <p id="hint-text">
            Haz clic sobre una estructura de la planta para examinarla.
        </p>

        <div id="plant-data" class="hidden">

            <div class="data-row">
                <strong>Estructura:</strong>
                <span id="part-name">-</span>
            </div>

            <div class="data-row">
                <strong>Geometría:</strong>
                <span id="part-geo">-</span>
            </div>

            <div class="data-row">
                <strong>Crecimiento:</strong>
                <span id="part-growth">0%</span>
            </div>

            <div class="growth-bar">
                <div id="growth-progress"></div>
            </div>

            <div class="data-row">
                <strong>Altura relativa:</strong>
                <span id="part-height">-</span>
            </div>

            <div class="data-row">
                <strong>Función biológica:</strong>
                <p id="part-desc" class="desc-text">
                    -
                </p>
            </div>

        </div>

    </aside>


    <!-- =====================================================
         PANEL DE CONTROLES DEL SIMULADOR
    ====================================================== -->

    <nav id="controls-toolbar" class="hud-card">

        <h4>⚙️ Simulador de Crecimiento</h4>


        <!-- VELOCIDAD DE CRECIMIENTO -->

        <div class="control-group slider-group">

            <label for="slider-growth">
                🌱 Velocidad de crecimiento:
                <span id="growth-val">1.0x</span>
            </label>

            <input
                type="range"
                id="slider-growth"
                min="0.2"
                max="3"
                step="0.1"
                value="1"
            >

        </div>


        <!-- NÚMERO DE RAMAS -->

        <div class="control-group slider-group">

            <label for="slider-branches">
                🌿 Número de ramas:
                <span id="branches-val">3</span>
            </label>

            <input
                type="range"
                id="slider-branches"
                min="1"
                max="3"
                step="1"
                value="3"
            >

        </div>


        <!-- INTENSIDAD DEL VIENTO -->

        <div class="control-group slider-group">

            <label for="slider-wind">
                💨 Intensidad del viento:
                <span id="wind-val">0.5</span>
            </label>

            <input
                type="range"
                id="slider-wind"
                min="0"
                max="2"
                step="0.1"
                value="0.5"
            >

        </div>


        <!-- INTENSIDAD DE LUZ -->

        <div class="control-group slider-group">

            <label for="slider-light">
                💡 Intensidad de luz:
                <span id="light-val">1.8</span>
            </label>

            <input
                type="range"
                id="slider-light"
                min="0.2"
                max="4"
                step="0.1"
                value="1.8"
            >

        </div>


        <!-- BOTONES -->

        <div class="control-group buttons-grid">

            <button id="btn-toggle-anim" class="btn">
                ⏸️ Pausar
            </button>

            <button id="btn-reset-growth" class="btn">
                🌱 Reiniciar crecimiento
            </button>

            <button id="btn-color-leaves" class="btn">
                🎨 Color hojas
            </button>

            <button id="btn-toggle-leaves" class="btn">
                👁️ Ocultar hojas
            </button>

            <button id="btn-reset-cam" class="btn">
                🎥 Reiniciar cámara
            </button>

        </div>

    </nav>


    <!-- =====================================================
         INDICADOR GENERAL DE LA SIMULACIÓN
    ====================================================== -->

    <div id="simulation-status" class="hud-card">

        <div class="status-title">
            🧬 Estado de simulación
        </div>

        <div class="status-row">
            <span>Desarrollo:</span>
            <strong id="global-growth">0%</strong>
        </div>

        <div class="status-row">
            <span>Viento:</span>
            <strong id="wind-status">0.5</strong>
        </div>

        <div class="status-row">
            <span>Estado:</span>
            <strong id="simulation-state">Creciendo</strong>
        </div>

    </div>


    <!-- =====================================================
         THREE.JS
    ====================================================== -->

    <script type="module" src="main.js"></script>

</body>
</html>
